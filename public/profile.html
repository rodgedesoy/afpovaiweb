<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Profile — AFP OVAI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a3dff, #ffffff);
      min-height: 100vh;
      color: #2d3748;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 20px 40px;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .header h1 {
      font-size: 24px;
      color: #2d3748;
      font-weight: 700;
    }

    .back-button {
      background: rgba(102, 126, 234, 0.1);
      border: 2px solid #667eea;
      color: #667eea;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .back-button:hover {
      background: #667eea;
      color: white;
      transform: translateX(-5px);
    }

    /* Main Container */
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 2px solid #e2e8f0;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 48px;
      color: white;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .profile-name {
      font-size: 28px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .profile-role {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Form Sections */
    .form-section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title svg {
      width: 24px;
      height: 24px;
      color: #667eea;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      background: #f7fafc;
      color: #2d3748;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input:disabled {
      background: #e2e8f0;
      cursor: not-allowed;
      color: #718096;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #718096;
      font-size: 18px;
      user-select: none;
      transition: 0.2s;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover {
      color: #2d3748;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid #667eea;
      color: #667eea;
    }

    .btn-secondary:hover {
      background: rgba(102, 126, 234, 0.1);
    }

    .btn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }

    /* Status Messages */
    .status-message {
      padding: 14px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-message.show {
      display: flex;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }

    /* Edit Mode Indicator */
    .edit-indicator {
      display: inline-block;
      padding: 8px 16px;
      background: #fff3cd;
      color: #856404;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      border: 2px solid #ffeaa7;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
      }

      .header h1 {
        font-size: 20px;
      }

      .container {
        padding: 15px;
        margin: 20px auto;
      }

      .profile-card {
        padding: 25px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Profile</h1>
    <a href="javascript:history.back()" class="back-button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Dashboard
    </a>
  </div>

  <div class="container">
    <div class="profile-card">
      
      <div class="profile-header">
        <div class="profile-avatar" id="avatarInitials">JD</div>
        <div class="profile-name" id="displayName">Loading...</div>
        <span class="profile-role" id="displayRole">USER</span>
      </div>

      <div id="statusMessage" class="status-message">
        <span id="statusText"></span>
      </div>

      <div id="editIndicator" class="edit-indicator" style="display: none;">
        ✏️ Edit Mode: Make your changes and click Save Profile
      </div>

      <form id="profileForm">
        <!-- Personal Information -->
        <div class="form-section">
          <div class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Personal Information
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" id="firstName" placeholder="Enter first name" disabled required />
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" id="lastName" placeholder="Enter last name" disabled required />
            </div>
          </div>
        </div>

        <!-- Contact Information -->
        <div class="form-section">
          <div class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Contact Information
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="email" placeholder="your@email.com" disabled required />
            </div>
            <div class="form-group">
              <label>Mobile Number</label>
              <input type="tel" id="mobileNumber" placeholder="+63 912 345 6789" disabled />
            </div>
          </div>
        </div>

        <!-- Security -->
        <div class="form-section">
          <div class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            Security
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>New Password (Leave blank to keep current)</label>
              <div class="password-wrapper">
                <input type="password" id="newPassword" placeholder="Enter new password" disabled />
                <span class="toggle-password" data-target="newPassword">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                  </svg>
                </span>
              </div>
            </div>
            <div class="form-group">
              <label>Confirm New Password</label>
              <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm new password" disabled />
                <span class="toggle-password" data-target="confirmPassword">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
          <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            Cancel
          </button>
          <button type="button" id="editBtn" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Edit Profile
          </button>
          <button type="submit" id="saveBtn" class="btn btn-primary" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Save Profile
          </button>
        </div>
      </form>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCw2Gf-FyZF9sBU450znJ1cyjjKWUkqTyY",
      authDomain: "afpovaiweb-8a7c9.firebaseapp.com",
      projectId: "afpovaiweb-8a7c9",
      storageBucket: "afpovaiweb-8a7c9.firebasestorage.app",
      messagingSenderId: "120025740192",
      appId: "1:120025740192:web:9f62d7395959642009eac5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elements
    const profileForm = document.getElementById('profileForm');
    const editBtn = document.getElementById('editBtn');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const statusMessage = document.getElementById('statusMessage');
    const statusText = document.getElementById('statusText');
    const editIndicator = document.getElementById('editIndicator');

    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const emailInput = document.getElementById('email');
    const mobileNumberInput = document.getElementById('mobileNumber');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');

    const displayName = document.getElementById('displayName');
    const displayRole = document.getElementById('displayRole');
    const avatarInitials = document.getElementById('avatarInitials');

    let isEditMode = false;
    let originalData = {};
    let currentUser = null;

    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(toggle => {
      toggle.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const passwordInput = document.getElementById(targetId);
        
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          this.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          `;
        } else {
          passwordInput.type = 'password';
          this.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          `;
        }
      });
    });

    // Show status message
    function showStatus(message, type = 'success') {
      statusText.textContent = message;
      statusMessage.className = `status-message show ${type}`;
      
      setTimeout(() => {
        statusMessage.classList.remove('show');
      }, 5000);
    }

    // Load user profile
    async function loadProfile(user) {
      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        
        if (userDoc.exists()) {
          const userData = userDoc.data();
          
          // Store original data
          originalData = {
            firstName: userData.firstName || '',
            lastName: userData.lastName || '',
            email: userData.email || user.email,
            mobileNumber: userData.mobileNumber || '',
            role: userData.role || 'resident'
          };

          // Populate form
          firstNameInput.value = originalData.firstName;
          lastNameInput.value = originalData.lastName;
          emailInput.value = originalData.email;
          mobileNumberInput.value = originalData.mobileNumber;

          // Update header
          const fullName = `${originalData.firstName} ${originalData.lastName}`;
          displayName.textContent = fullName;
          displayRole.textContent = originalData.role.toUpperCase();
          
          // Update avatar initials
          const initials = `${originalData.firstName.charAt(0)}${originalData.lastName.charAt(0)}`.toUpperCase();
          avatarInitials.textContent = initials;
          
        } else {
          showStatus('User profile not found', 'error');
        }
      } catch (error) {
        console.error('Error loading profile:', error);
        showStatus('Error loading profile: ' + error.message, 'error');
      }
    }

    // Enable edit mode
    function enableEditMode() {
      isEditMode = true;
      
      // Enable inputs
      firstNameInput.disabled = false;
      lastNameInput.disabled = false;
      mobileNumberInput.disabled = false;
      newPasswordInput.disabled = false;
      confirmPasswordInput.disabled = false;
      
      // Email stays disabled (can't change email easily in Firebase)
      emailInput.disabled = true;
      
      // Toggle buttons
      editBtn.style.display = 'none';
      saveBtn.style.display = 'inline-flex';
      cancelBtn.style.display = 'inline-flex';
      editIndicator.style.display = 'block';
    }

    // Disable edit mode
    function disableEditMode() {
      isEditMode = false;
      
      // Disable inputs
      firstNameInput.disabled = true;
      lastNameInput.disabled = true;
      mobileNumberInput.disabled = true;
      newPasswordInput.disabled = true;
      confirmPasswordInput.disabled = true;
      
      // Clear password fields
      newPasswordInput.value = '';
      confirmPasswordInput.value = '';
      
      // Toggle buttons
      editBtn.style.display = 'inline-flex';
      saveBtn.style.display = 'none';
      cancelBtn.style.display = 'none';
      editIndicator.style.display = 'none';
    }

    // Cancel edit
    function cancelEdit() {
      // Restore original values
      firstNameInput.value = originalData.firstName;
      lastNameInput.value = originalData.lastName;
      emailInput.value = originalData.email;
      mobileNumberInput.value = originalData.mobileNumber;
      
      disableEditMode();
      showStatus('Changes cancelled', 'error');
    }

    // Save profile
    async function saveProfile(e) {
      e.preventDefault();
      
      if (!currentUser) {
        showStatus('No user logged in', 'error');
        return;
      }

      // Validate passwords if provided
      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();
      
      if (newPassword || confirmPassword) {
        if (newPassword !== confirmPassword) {
          showStatus('Passwords do not match', 'error');
          return;
        }
        if (newPassword.length < 6) {
          showStatus('Password must be at least 6 characters', 'error');
          return;
        }
      }

      try {
        // Update Firestore profile
        const updatedData = {
          firstName: firstNameInput.value.trim(),
          lastName: lastNameInput.value.trim(),
          mobileNumber: mobileNumberInput.value.trim(),
          updatedAt: new Date()
        };

        await updateDoc(doc(db, 'users', currentUser.uid), updatedData);

        // Update password if provided
        if (newPassword) {
          await updatePassword(currentUser, newPassword);
          showStatus('Profile and password updated successfully!', 'success');
        } else {
          showStatus('Profile updated successfully!', 'success');
        }

        // Update original data
        originalData = {
          ...originalData,
          ...updatedData
        };

        // Update display
        const fullName = `${updatedData.firstName} ${updatedData.lastName}`;
        displayName.textContent = fullName;
        const initials = `${updatedData.firstName.charAt(0)}${updatedData.lastName.charAt(0)}`.toUpperCase();
        avatarInitials.textContent = initials;

        disableEditMode();

      } catch (error) {
        console.error('Error saving profile:', error);
        
        if (error.code === 'auth/requires-recent-login') {
          showStatus('Please log out and log back in to change your password', 'error');
        } else {
          showStatus('Error saving profile: ' + error.message, 'error');
        }
      }
    }

    // Event listeners
    editBtn.addEventListener('click', enableEditMode);
    cancelBtn.addEventListener('click', cancelEdit);
    profileForm.addEventListener('submit', saveProfile);

    // Check authentication
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadProfile(user);
      } else {
        // Redirect to login if not authenticated
        window.location.href = 'login.html';
      }
    });
  </script>

</body>
</html>
